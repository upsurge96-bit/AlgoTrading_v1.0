# Updated Docker Compose with Base Service Pattern
services:
  # Base service definition that other services can extend
  x-base-service: &base-service
    build:
      context: .
    volumes:
      - ./core:/app/core
      - ./common:/app/common
      - ./config:/app/config
      - ./logs:/logs
    environment:
      - PYTHONPATH=/app
      - DOCKER_ENV=true
      - LOG_DIR=/logs

  # ==================================================
  # 🧠 AUTHENTICATION SERVICE
  # ==================================================
  auth_service:
    <<: *base-service
    build:
      context: .                              
      dockerfile: ./services/auth_service/Dockerfile
    container_name: auth_service
    ports:
      - "8018:8018"
    environment:
      - SERVICE_NAME=auth_service
      - LOG_FILE=/logs/auth_service.log
      # Kafka configuration
      - KAFKA_BROKERS=kafka:9092
      - ENABLE_KAFKA=true
      - KAFKA_CLIENT=confluent
      # Security settings
      - TOKEN_ENCRYPTION_KEY=change_this_in_production_super_secret_key
      - ADMIN_API_KEY=change_this_in_production_admin_key
    env_file:
      - .env
      - ./config/secrets.env
    volumes:
      - ./.env:/app/.env
      - ./config:/app/config
      - ./logs:/logs
      - ./services/auth_service/data:/app/data
    restart: always
    depends_on:
      - data_service
      - kafka
      - zookeeper
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==================================================
  # 🧠 DATA INGESTION SERVICE
  # ==================================================
  data_service:
    <<: *base-service
    build:
      context: .
      dockerfile: ./services/data_service/Dockerfile
    container_name: data_service
    restart: always
    env_file:
      - .env
      - ./config/secrets.env
    environment:
      - SERVICE_NAME=data_service
      - LOG_DIR=/logs
      - LOG_FILE=/logs/data_service.log
      - DATABASE_URL=postgresql://trader:traderpass@timescaledb:5432/trading
      - ADMIN_API_KEY=change_this_in_production_admin_key
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    ports:
      - "${DATA_SERVICE_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - monitoring-net
    command: >
      uvicorn services.data_service.main:app
      --host 0.0.0.0
      --port 8080

  # --------------------------------------------------------------
  # 🔸 Zookeeper
  # --------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - monitoring-net
    restart: unless-stopped

  # --------------------------------------------------------------
  # 🔸 Kafka Broker
  # --------------------------------------------------------------
  kafka:
   image: confluentinc/cp-kafka:7.6.1
   container_name: kafka
   depends_on:
     - zookeeper
   environment:
     KAFKA_BROKER_ID: 1
     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
   ports:
     - "9092:9092"
   networks:
     - monitoring-net
   restart: unless-stopped

  # --------------------------------------------------------------
  # 🪣 MinIO (Historical Storage)
  # --------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioaccess
      MINIO_ROOT_PASSWORD: miniopass
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - monitoring-net

  # --------------------------------------------------------------
  # 🐘 TimescaleDB (Postgres + Timescale extension)
  # --------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpass
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres -c max_connections=100
               -c shared_buffers=512MB
               -c work_mem=16MB
               -c maintenance_work_mem=128MB
               -c effective_cache_size=2GB
               -c timescaledb.max_background_workers=8
               -c timescaledb.telemetry_level=off
    networks:
      - monitoring-net

  # ==================================================
  # 🪵 MONITORING + LOGS STACK
  # ==================================================
  monitoring_service:
    <<: *base-service
    build:
      context: .
      dockerfile: ./services/monitoring-service/Dockerfile
    container_name: monitoring_service
    restart: always
    env_file: .env
    environment:
      - SERVICE_NAME=monitoring_service
      - LOG_FILE=/logs/monitoring_service.log
    volumes:
      - ./logs:/logs
      - ./config:/app/config
    ports:
      - "${MONITOR_PORT:-8070}:8070"
    depends_on:
      - prometheus
      - loki
      - alertmanager
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring-net

  # --------------------------------------------------------------
  # ⚙️ Strategy Service
  # --------------------------------------------------------------
  strategy_service:
    <<: *base-service
    build:
      context: .
      dockerfile: ./services/strategy-service/Dockerfile
    container_name: strategy_service
    restart: always
    env_file:
      - .env
      - ./config/secrets.env
    environment:
      - SERVICE_NAME=strategy_service
      - LOG_FILE=/logs/strategy_service.log
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    ports:
      - "8020:8020"
    networks:
      - monitoring-net

  # --------------------------------------------------------------
  # ⚙️ Execution Service
  # --------------------------------------------------------------
  execution_service:
    <<: *base-service
    build:
      context: .
      dockerfile: ./services/execution-service/Dockerfile
    container_name: execution_service
    restart: always
    env_file:
      - .env
      - ./config/secrets.env
    environment:
      - SERVICE_NAME=execution_service
      - LOG_FILE=/logs/execution_service.log
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    ports:
      - "8030:8030"
    networks:
      - monitoring-net

  # --------------------------------------------------------------
  # ⚙️ Risk Service
  # --------------------------------------------------------------
  risk_service:
    <<: *base-service
    build:
      context: .
      dockerfile: ./services/risk-service/Dockerfile
    container_name: risk_service
    restart: always
    env_file:
      - .env
      - ./config/secrets.env
    environment:
      - SERVICE_NAME=risk_service
      - LOG_FILE=/logs/risk_service.log
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    ports:
      - "8040:8040"
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    volumes:
      - ./monitoring/alerts:/etc/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - monitoring-net

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - ./logs:/var/log/trading
    ports:
      - "3100:3100"
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/trading
    depends_on:
      - loki
    networks:
      - monitoring-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: rahulkujur31@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - timescaledb
    networks:
      - monitoring-net 

# ==================================================
# 🔹 NETWORK
# ==================================================
networks:
  monitoring-net:
    driver: bridge